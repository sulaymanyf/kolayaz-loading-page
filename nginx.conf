server {
  listen 80;
  server_name landing.kolayaz.com localhost _;

  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ $uri.html /index.html;
  }

  location = /cdn-cgi/rum {
    access_log off;
    return 204;
  }

  location = /__deploy_check {
    default_type text/plain;
    return 200 "kolayaz-static-nginx\n";
  }

  location = /favicon.ico {
    try_files /icon-light-32x32.png =204;
  }

  location ~* \.(?:css|js|mjs|jpg|jpeg|gif|png|svg|ico|webp|woff2?)$ {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
